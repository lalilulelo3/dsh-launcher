name: 构建并发布 Windows exe

# 触发方式：
#   1) 推送形如 v1.0.1 的标签 —— 自动打包并发布 Release
#   2) 在 Actions 页面手动运行 —— 需要填一个 tag 名
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签名（例如 v1.0.1）"
        required: true

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 语法自检
        run: python -m py_compile core.py plugins.py launcher.py backup.py

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 打包单文件 exe
        run: python -m PyInstaller --noconfirm --clean -w -F -n DSH-Launcher launcher.py

      - name: 上传构建产物（即使发布失败也能在 Actions 页面下载）
        uses: actions/upload-artifact@v7
        with:
          name: DSH-Launcher
          path: dist/DSH-Launcher.exe

      - name: 创建 / 更新 Release 并附带 exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          Write-Host "发布标签: $tag"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/DSH-Launcher.exe --clobber
          } else {
            gh release create $tag dist/DSH-Launcher.exe --title "$tag" --generate-notes
          }
